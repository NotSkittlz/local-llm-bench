[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-bench"
version = "0.1.0"
description = "Benchmark local LLM inference on your own hardware."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lucas Guerra" }]
keywords = [
  "llm",
  "benchmark",
  "inference",
  "local",
  "llama.cpp",
  "vllm",
  "ollama",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "jinja2>=3.1",
  "psutil>=6.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]
nvidia = [
  "nvidia-ml-py>=12.0",
]

[project.scripts]
llmbench = "llmbench.cli:app"

[project.urls]
Homepage = "https://github.com/NotSkittlz/local-llm-bench"
Repository = "https://github.com/NotSkittlz/local-llm-bench"
Issues = "https://github.com/NotSkittlz/local-llm-bench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/samples",
  "/LICENSE",
  "/README.md",
  "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: longer-running integration-style tests",
  "adversarial: fault-injection and edge-case tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "RUF",
  "SIM",
  "UP",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
